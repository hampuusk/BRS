<title>PlanPin</title>
<script type="module" src="pdf-init.mjs"></script>
<script src="pdf-lib.min.js"></script>
<style>
html {
  touch-action: manipulation;
}
/* Layout: one-screen app. Project list → full-bleed drawing with pan/zoom, bottom bar, slide-up sheets. Markers are numbered site tags. */
:root {
  --paper: #f6f7f5;
  --surface: #ffffff;
  --ink: #1d2321;
  --muted: #5f6a66;
  --line: #d9dedb;
  --tag: #c2410c;
  --tag-deep: #9a3412;
  --tag-ink: #ffffff;
  --tag-soft: #fdebdd;
  --brand: #c2410c; /* the drawing's markers and the kind Inventering: orange whatever the app's colour */
  --ok: #2f7d55;
  --danger: #b3261e;
  --plan-bg: #e9ece9;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: var(--font-ui); /* numbers in the same font as all other text, with even widths (tabular-nums) */
  /* text sizes: the only ones used in the app */
  --fs-xs: 12px;
  --fs-s: 13px;
  --fs-m: 14px;
  --fs-b: 16px;
  --fs-l: 18px;
  --fs-xl: 20px;
  --fs-xxl: 24px;
  /* line heights: headings and short labels, running text */
  --lh-tight: 1.2;
  --lh: 1.4;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141716;
    --surface: #1d2120;
    --ink: #e8ece9;
    --muted: #9aa5a0;
    --line: #323836;
    --tag: #ff7a33;
    --tag-deep: #ff7a33;
    --tag-ink: #1a0d06;
    --tag-soft: #3b2416;
    --brand: #ff7a33;
    --ok: #5fc08e;
    --danger: #ff8a80;
    --plan-bg: #0e1110;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141716;
  --surface: #1d2120;
  --ink: #e8ece9;
  --muted: #9aa5a0;
  --line: #323836;
  --tag: #ff7a33;
  --tag-deep: #ff7a33;
  --tag-ink: #1a0d06;
  --tag-soft: #3b2416;
  --brand: #ff7a33;
  --ok: #5fc08e;
  --danger: #ff8a80;
  --plan-bg: #0e1110;
  color-scheme: dark;
}
html,
body {
  height: 100%;
}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-b);
  line-height: var(--lh);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}
* {
  box-sizing: border-box;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
label:focus-within {
  outline: 2px solid var(--tag);
  outline-offset: 2px;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.view {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar h1 {
  font-size: var(--fs-l);
  font-weight: 700;
  margin: 0;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
}
.iconbtn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  height: 44px; /* every tap target at least 44 px */
  min-width: 44px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
  font-size: var(--fs-m);
}
.btn {
  border: 0;
  border-radius: var(--r);
  padding: 12px 16px;
  min-height: 44px;
  font-weight: 600;
  font-size: var(--fs-b);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn.primary {
  background: var(--tag);
  color: var(--tag-ink);
}
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
}
.btn.danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--line);
}
.btn[disabled] {
  opacity: 0.5;
  cursor: default;
}
.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow {
  font-size: var(--fs-xs);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.note {
  font-size: var(--fs-s);
  color: var(--muted);
  background: var(--tag-soft);
  border-radius: 8px;
  padding: 8px 12px;
  line-height: var(--lh);
}

/* Projects (home page) */
:root {
  --k-inv: var(--brand);
  --k-ctl: #2f7d55;
  --blue: #3b6ea5;
  --chk: #0f766e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --k-ctl: #5fc08e;
    --blue: #7fa9dc;
    --chk: #2dd4bf;
  }
}
:root[data-theme="dark"] {
  --k-ctl: #5fc08e;
  --blue: #7fa9dc;
  --chk: #2dd4bf;
}
.home .bar {
  gap: 8px;
  flex-wrap: wrap; /* big text on a narrow phone: the button goes under the name instead of squeezing it */
}
.brand {
  flex: 1 1 auto; /* as wide as its name: with big text the button wraps under it instead of the name being cut */
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand h1 {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-xxl);
  font-weight: 700;
  letter-spacing: 0.005em;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pinmark {
  flex: none;
  height: 27px;
  width: 20px;
}
.brand h1 .word {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pinmark .body {
  fill: var(--tag);
}
.pinmark .hole {
  fill: var(--surface);
}
.brand h1 .acc {
  color: var(--tag);
}
.lockbtn {
  padding: 0;
  width: 38px;
  flex: none;
}
.gearbtn {
  padding: 0;
  width: 38px;
  flex: none;
  color: var(--muted);
}
.gear .hole {
  fill: var(--surface);
}
.themeseg {
  width: 100%;
}
.themeseg .seg {
  flex: 1;
}
.calib {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 4;
}
.pickbtn {
  grid-row: 1/3;
  grid-column: 2;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 5px 12px;
  min-height: 44px;
  font-weight: 600;
  font-size: var(--fs-s);
}
.pickbtn.on {
  background: var(--tag);
  color: var(--tag-ink);
  border-color: var(--tag);
}
.sitem.picking,
.ocard.picking {
  position: relative;
  padding-left: 44px !important;
  cursor: pointer;
}
.sitem.picking::before,
.ocard.picking::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  width: 20px;
  height: 20px;
  margin-top: -10px;
  border: 2px solid var(--muted);
  border-radius: 6px;
  background: var(--surface);
}
.sitem.picked,
.ocard.picked {
  background: var(--tag-soft);
}
.sitem.picked::before,
.ocard.picked::before {
  background: var(--tag);
  border-color: var(--tag);
}
.sitem.picked::after,
.ocard.picked::after {
  content: "";
  position: absolute;
  left: 19px;
  top: 50%;
  width: 6px;
  height: 11px;
  margin-top: -8px;
  border: solid var(--tag-ink);
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.sitem.picking .sactions {
  display: none !important;
}
.pickbar {
  position: sticky;
  bottom: 0;
  z-index: 3;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 8px;
  box-shadow: 0 -6px 14px rgba(0, 0, 0, 0.08);
}
.pickbar .prow1 {
  display: flex;
  align-items: center;
  gap: 12px;
}
.pickbar .pcnt {
  flex: 1;
  font-size: var(--fs-b);
  white-space: nowrap;
}
.pickbar .prow2 {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pickbar .prow2 .sbtn {
  flex: 1 1 auto;
}
.pickbar button[disabled] {
  opacity: 0.45;
}
.opick .pickbar {
  position: static;
}
.orow {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
.orow .addobj {
  flex: 1;
}
@media (max-width: 420px) {
  .brand h1 {
    font-size: var(--fs-xl);
    gap: 8px;
  }
  .home .bar {
    gap: 6px;
  }
}
.newbtn {
  gap: 0;
  white-space: pre;
  padding: 9px 14px;
  font-size: var(--fs-b);
  flex: none;
}
@media (max-width: 300px) {
  .newbtn .long {
    display: none;
  }
}
@media (max-width: 345px) {
  .home .bar:has(.lockbtn) .newbtn .long {
    display: none;
  }
}
.lockbtn .sicon {
  background: transparent;
}
.storinfo {
  display: grid;
  gap: 4px;
  font-size: var(--fs-s);
  line-height: var(--lh);
}
.storinfo p {
  margin: 0;
  color: var(--muted);
}
.storinfo p.ok {
  color: var(--ok);
}
.storinfo p.warn {
  color: var(--ink);
}
.storinfo .linkbtn {
  justify-self: start;
  font-size: var(--fs-s);
}
.lostcard {
  display: grid;
  gap: 8px;
  border: 1.5px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, var(--surface));
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 16px;
}
.lostcard b {
  font-size: var(--fs-b);
  color: var(--danger);
}
.lostcard p {
  margin: 0;
  line-height: var(--lh);
  font-size: var(--fs-m);
}
.lostcard .row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.lostcard .btn {
  flex: 1 1 150px;
  padding: 10px 14px;
  font-size: var(--fs-b);
}
.status {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 9px 12px;
  margin-bottom: 18px;
}
.status b {
  display: block;
  font-size: var(--fs-b);
}
.status small {
  display: block;
  color: var(--muted);
  font-size: var(--fs-s);
  line-height: var(--lh);
  margin-top: 1px;
}
.status .linkbtn {
  white-space: nowrap;
}
.sicon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--tag-soft);
  position: relative;
}
.sicon::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 12px;
  width: 12px;
  height: 9px;
  border-radius: 2px;
  background: var(--tag-deep);
}
.sicon::after {
  content: "";
  position: absolute;
  left: 10px;
  top: 6px;
  width: 8px;
  height: 9px;
  border: 2px solid var(--tag-deep);
  border-bottom: 0;
  border-radius: 5px 5px 0 0;
  box-sizing: border-box;
}
.status:not(.on) .sicon::after {
  left: 12px;
  width: 8px;
}
.listhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.sortseg {
  display: inline-flex;
  flex-wrap: wrap; /* big text: a choice that does not fit goes to a second row instead of being cut */
  background: var(--plan-bg);
  border-radius: 9px;
  padding: 3px;
  gap: 2px;
}
.seg {
  border: 0;
  background: transparent;
  border-radius: 7px;
  padding: 6px 11px;
  font-size: var(--fs-m);
  font-weight: 600;
  color: var(--muted);
  min-width: 44px;
  min-height: 44px;
  white-space: nowrap;
}
.seg.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, 0.12),
    0 0 0 1px var(--line);
}
.plist {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}
.ghead {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: var(--fs-b);
  margin: 8px 2px -2px;
}
.ghead:first-child {
  margin-top: 0;
}
.ghead em {
  font-style: normal;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
  color: var(--muted);
  font-weight: 600;
}
.kdot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--k-inv);
}
.pcard {
  display: grid;
  grid-template-columns: 76px 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 8px 10px 8px 8px;
  text-align: left;
  width: 100%;
  transition:
    border-color 0.15s,
    transform 0.1s;
}
.pcard:active {
  transform: scale(0.99);
}
@media (hover: hover) {
  .pcard:hover {
    border-color: var(--muted);
  }
}
.pthumb {
  width: 76px;
  height: 64px;
  border-radius: 7px;
  overflow: hidden;
  background: var(--plan-bg);
  border: 1px solid var(--line);
}
.pthumb img,
.pthumb .ph {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pthumb .ph {
  background: repeating-linear-gradient(to bottom, transparent 0 11px, var(--line) 11px 12px);
  background-position: 0 6px;
  position: relative;
}
.pthumb .ph::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 0;
  bottom: 0;
  width: 1.5px;
  background: color-mix(in srgb, var(--blue) 45%, transparent);
}
.pbody {
  min-width: 0;
  display: grid;
  gap: 3px;
  justify-items: start;
}
.pbody b {
  font-size: var(--fs-b);
  line-height: var(--lh-tight);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  max-width: 100%;
}
.pbody small {
  color: var(--muted);
  font-size: var(--fs-s);
  line-height: var(--lh);
}
.pbody small {
  overflow-wrap: anywhere; /* big text on a narrow phone: the number and date wrap instead of running out of the card */
}
.kchip {
  font-size: var(--fs-xs);
  font-weight: 600;
  border-radius: 999px;
  padding: 1px 8px 1px 7px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--k-inv);
  background: color-mix(in srgb, var(--k-inv) 13%, transparent);
}
.kchip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.k-ctl.kchip,
.k-ctl.kdot {
  --k-inv: var(--k-ctl);
}
.count {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-s);
  background: var(--tag-soft);
  color: var(--tag-deep);
  border-radius: 999px;
  padding: 3px 9px;
  font-weight: 600;
}
.pcount {
  display: grid;
  justify-items: center;
  line-height: 1;
  background: var(--tag-soft);
  color: var(--tag-deep);
  border-radius: 9px;
  padding: 6px 8px;
  min-width: 44px;
}
.pcount strong {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-b);
  font-weight: 600;
}
.pcount i {
  font-style: normal;
  font-size: var(--fs-xs);
  font-weight: 600;
  margin-top: 2px;
  opacity: 0.85;
}
.backups {
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 10px;
}
.backups .btnrow {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.backups .btn {
  flex: 1 1 200px; /* on a phone each button has its own row ("Säkerhetskopiera alla" never breaks); side by side on a tablet */
  padding: 10px 14px;
  font-size: var(--fs-b);
}
@media (min-width: 760px) {
  .home .scroll > * {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }
  .plist {
    grid-template-columns: 1fr 1fr;
  }
  .ghead {
    grid-column: 1/-1;
  }
}
.empty {
  margin-top: 24px;
  border: 1.5px dashed var(--line);
  border-radius: var(--r);
  padding: 24px 18px;
  display: grid;
  gap: 14px;
}
.empty h2 {
  margin: 0;
  font-size: var(--fs-xl);
  text-wrap: balance;
}
.steps {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 10px;
}
.steps li {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 10px;
  align-items: start;
  color: var(--muted);
  line-height: var(--lh);
}
.steps li span {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--tag);
  color: var(--tag-ink);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-s);
  display: grid;
  place-items: center;
  font-weight: 600;
}

/* Plan view */
.vp {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  background: var(--plan-bg);
  touch-action: none;
  cursor: crosshair;
}
.stage {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}
.stage img {
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  max-width: none;
  background: #fff;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
}
.mk {
  position: absolute;
  width: 0;
  height: 0;
}
.mk i {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -50%) scale(var(--inv, 1));
  transform-origin: 50% 50%;
  font-style: normal;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 14px; /* on the drawing: sized with the drawing, not with the phone's text size */
  -webkit-text-size-adjust: none;
  text-size-adjust: none;
  color: #fff;
  background: var(--mc, var(--brand));
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  box-shadow:
    0 0 0 2px #fff,
    0 2px 6px rgba(0, 0, 0, 0.35);
}
.mk.pending i {
  outline: 2px dashed var(--ink);
  outline-offset: 2px;
}
/* a checkpoint (Checklista) not yet an object: a white square tag with a dashed teal edge and a check mark; ticked: teal */
.mk.chk i {
  background: #fff;
  color: var(--chk);
  border: 2px dashed var(--chk);
  border-radius: 7px;
  min-width: 28px;
  padding: 0;
  font-size: 15px;
}
.mk.chk.done i {
  background: var(--chk);
  color: #fff;
  border-style: solid;
}
.chkbanner {
  display: grid;
  gap: 2px;
  padding: 10px 12px;
  border: 2px dashed var(--chk);
  border-radius: 10px;
  color: var(--ink);
}
.chkbanner small {
  color: var(--chk);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 12px;
}
.chklist {
  display: grid;
  gap: 6px;
}
.chkrow {
  display: flex;
  flex-wrap: wrap; /* on a narrow screen the buttons take a row of their own, so a long word is never broken */
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.chkrow .check {
  flex: 1 1 200px; /* less than that for the text (a long compound word) and the buttons move down */
  min-width: 0;
}
.chkrow .check span {
  display: grid;
  gap: 2px;
  overflow-wrap: anywhere;
}
.chkrow.done .check span {
  color: var(--muted);
}
.chkbtns {
  display: flex;
  gap: 6px;
  flex: none;
  margin-left: auto; /* to the right, also when on a row of their own */
}
.chkbtns .sbtn {
  white-space: nowrap;
}
.chkadd {
  display: flex;
  gap: 8px;
}
.chkadd input {
  flex: 1;
  min-width: 0;
}
/* between number and dot the marker glides: the badge shrinks and its number fades (scale is its own property, so
   it never lags behind the zoom; not with Animerade övergångar off, or less motion on the phone) */
@media (prefers-reduced-motion: no-preference) {
  :root:not(.noanim) .mk i {
    transition:
      scale 0.24s ease,
      color 0.18s ease;
  }
}
/* a marker that would touch another at full size: a small dot in its group's colour (see fitMarkers), about 11 px */
.mk:not(.dot):not(.fout) {
  z-index: 1; /* the markers with their number lie over the dots */
}
.mk.dot i {
  scale: 0.4;
  color: transparent;
}
.mk.dot.long i {
  scale: 0.33;
}

.hint {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 14px;
  font-size: var(--fs-m);
  line-height: var(--lh);
  text-align: center;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  width: max-content;
  max-width: calc(100% - 32px); /* long texts wrap instead of being cut off */
  transition: opacity 0.4s;
}
.foot {
  display: flex;
  gap: 10px;
  padding-block: 10px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.foot .btn {
  flex: 1;
}

/* Sheets */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 12, 0.45);
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  background: var(--surface);
  width: 100%;
  max-width: 560px;
  max-height: 92%;
  overflow-y: auto;
  border-radius: 16px 16px 0 0;
  padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 14px;
  overscroll-behavior: contain;
  will-change: transform;
  overflow-wrap: anywhere; /* big text: a long heading or word wraps instead of running out of the sheet */
}
.sheet .grab {
  width: 44px;
  height: 5px;
  border-radius: 3px;
  background: var(--line);
  justify-self: center;
  margin: -4px 0 -2px;
  position: relative;
}
.sheet .grab::before {
  content: "";
  position: absolute;
  inset: -14px -40px;
}
.shead {
  display: flex;
  align-items: center;
  gap: 12px;
}
.bigtag {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: var(--fs-xl);
  background: var(--tag);
  color: var(--tag-ink);
  height: 40px;
  min-width: 40px;
  padding: 0 10px;
  border-radius: 999px;
  display: grid;
  place-items: center;
}
.bigtag[style*="background"] {
  color: #fff;
}
.shead h2 {
  margin: 0;
  font-size: min(
    var(--fs-xl),
    7.4vw
  ); /* with big text on a narrow screen the heading shrinks a little rather than wraps ("Uppdragsinställningar") */
  flex: 1;
}
.photo {
  border-radius: var(--r);
  background: var(--plan-bg);
  aspect-ratio: 4/3;
  max-width: 100%;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--muted);
  font-size: var(--fs-m);
  text-align: center;
  padding: 0;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.pick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pick label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface);
}
.pick label {
  position: relative;
  overflow: hidden;
}
.pick input,
.hidden-input {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  opacity: 0;
}
label.btn {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.field {
  display: grid;
  gap: 6px;
}
.field label {
  font-size: var(--fs-s);
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
textarea,
input[type="text"],
input[type="password"] {
  width: 100%;
  font: inherit;
  font-size: var(--fs-b);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;
}
textarea {
  min-height: 76px;
  resize: vertical;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.row .btn {
  flex: 1 1 120px;
}

/* List */

.floors {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-block: 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  scrollbar-width: none;
}
.floors::-webkit-scrollbar {
  display: none;
}
.floor {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  font-size: var(--fs-m);
  white-space: nowrap;
  cursor: pointer;
}
.floor .fcount {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 7px;
}
.floor.on {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.floor.on .fcount {
  color: var(--ink);
  background: var(--surface);
  border-color: var(--surface);
}
.floor.add {
  border-style: dashed;
  color: var(--tag);
  user-select: none;
  -webkit-user-select: none;
}
.check {
  display: flex;
  gap: 10px;
  align-items: center;
  min-height: 44px;
  font-weight: 600;
  cursor: pointer;
}
/* "Symboler visas på:" in the export sheet: one box per group (just the name), indented under the text */
.symon {
  display: grid;
  gap: 0;
}
.symon > small {
  font-weight: 600;
  color: var(--muted);
  padding-top: 6px;
}
.check.sub {
  padding-left: 30px;
}
/* the list's filter: a thin line between the groups and the categories */
.fsep {
  flex: 0 0 1px;
  align-self: stretch;
  margin: 6px 2px;
  background: var(--line);
}
.check input {
  width: 20px;
  height: 20px;
  accent-color: var(--tag);
}
.flist {
  display: grid;
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}
.frow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  text-align: left;
  padding: 10px 12px;
  background: var(--surface);
  border: 0;
  border-bottom: 1px solid var(--line);
}
.frow:last-child {
  border-bottom: 0;
}
.frow span {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-s);
  color: var(--muted);
  text-align: right;
}
.side {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(48%, 250px);
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.14);
  overflow-y: auto;
  touch-action: pan-y;
  overscroll-behavior: contain;
  z-index: 6;
  cursor: default;
}
.side {
  will-change: transform;
}
.sidehead {
  position: sticky;
  top: 0;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 0 8px;
  padding: 10px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.sidehead b {
  font-size: var(--fs-b);
}
.sidehead span {
  grid-row: 2;
  font-size: var(--fs-xs);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.sideclose {
  grid-row: 1/3;
  grid-column: 3;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--danger);
  font-weight: 700;
}
.side .spacer {
  height: 96px;
  flex: 0 0 auto;
}
.sideempty {
  padding: 14px 12px;
  color: var(--muted);
  font-size: var(--fs-m);
  line-height: var(--lh);
  margin: 0;
}
.sitem {
  padding: 10px 12px 10px 10px;
  border-left: 4px solid transparent;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  display: grid;
  gap: 4px;
}
.sitem .stop {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
}
.sitem .stags {
  grid-column: 1 / -1; /* its own row under the number and photo: room for long category names */
  grid-row: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-width: 0;
}
.sitem .stags:empty {
  display: none;
}
.sitem .sfloor {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ink);
}
.sidescope {
  margin: 0 12px 6px;
}
.sitem .stop b {
  font-family: var(--font-num);
  font-size: var(--fs-l);
  color: var(--tag);
  min-width: 24px;
  font-variant-numeric: tabular-nums;
}
.sitem .stop img {
  width: 44px;
  height: 33px;
  object-fit: cover;
  border-radius: 4px;
  grid-column: 3;
}
.sitem p {
  margin: 0;
  font-size: var(--fs-m);
  line-height: var(--lh);
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sitem p.none {
  color: var(--muted);
  font-style: italic;
}
.sactions {
  display: none;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}
.sactions .sbtn {
  flex: 1 1 auto;
  padding: 6px 7px;
  font-size: var(--fs-xs);
}
.sitem.sel {
  background: var(--tag-soft);
  border-left-color: var(--tag);
}
.sitem.sel .sactions {
  display: flex;
}
.sitem.sel p {
  -webkit-line-clamp: unset;
  display: block;
}
.sbtn {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 6px;
  min-height: 44px;
  font-weight: 600;
  font-size: var(--fs-s);
}
.sbtn.danger {
  color: var(--danger);
}
.vp.with-side .hint {
  left: calc((100% - min(48%, 250px)) / 2);
  max-width: calc(100% - min(48%, 250px) - 24px);
}
.stage.anim {
  transition: transform 0.35s ease;
}
.stage.dim .mk:not(.sel) i {
  opacity: 0.35;
}
.mk.sel {
  z-index: 3;
}
.mk.fout i {
  opacity: 0.18;
}
.mk.fout {
  z-index: 0;
}
.vp.lifting .mk.moving i,
.vp.lifting .mk.move i {
  filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35));
}
.mk.chk.lifting {
  z-index: 4;
}
.mk.chk.lifting i {
  filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35));
  scale: 1.15;
}
.fbar {
  display: grid;
  gap: 8px;
  padding: 8px 0 4px;
}
.side .fbar {
  position: sticky;
  top: 57px;
  z-index: 2;
  background: var(--surface);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.fsearch {
  width: 100%;
  font: inherit;
  font-size: var(--fs-b); /* 16 px or more: phones do not zoom in when the field is tapped */
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
}
.fchips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.fchips::-webkit-scrollbar {
  display: none;
}
.fchips .cat {
  flex: none;
  font-size: var(--fs-s);
  padding: 5px 10px;
}
.ffoot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.finfo {
  font-size: var(--fs-s);
  color: var(--muted);
}
.fclear {
  font-size: var(--fs-s);
  padding: 2px 0;
}
.fnone {
  color: var(--muted);
  font-size: var(--fs-m);
  padding: 12px;
}
.mk.sel i {
  transform: translate(-50%, -50%) scale(calc(var(--inv, 1) * 1.35));
}
.mk.sel::after {
  content: "";
  position: absolute;
  left: -28px;
  top: -28px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 3px solid var(--mc, var(--brand));
  transform: scale(var(--inv, 1));
  pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .mk.sel::after {
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse {
    from {
      transform: scale(calc(var(--inv, 1) * 0.6));
      opacity: 1;
    }
    to {
      transform: scale(calc(var(--inv, 1) * 1.5));
      opacity: 0;
    }
  }
}
.movebar {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 7;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  background: var(--ink);
  color: var(--surface);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}
.movebar span {
  flex: 1 1 160px;
  font-size: var(--fs-s);
  line-height: var(--lh);
}
.movebar b {
  display: block;
  font-size: var(--fs-b);
}
.movebar .sbtn {
  flex: 0 0 auto;
  padding: 8px 14px;
  color: var(--ink);
}
.movebar .sbtn.ok {
  background: var(--tag);
  color: var(--tag-ink);
  border-color: var(--tag);
}
.vp.with-side .movebar {
  right: calc(min(48%, 250px) + 10px);
}
.stage.moveon .mk:not(.moving) i {
  opacity: 0.35;
}
.mk.moving {
  z-index: 4;
}
.mk.moving i {
  background: var(--ink);
  color: var(--surface);
  transform: translate(-50%, calc(-100% - 20px * var(--inv, 1))) scale(calc(var(--inv, 1) * 1.45));
  box-shadow:
    0 0 0 2px #fff,
    0 4px 12px rgba(0, 0, 0, 0.45);
}
.mk.moving::before {
  content: "";
  position: absolute;
  left: -5px;
  top: -5px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--tag);
  box-shadow: 0 0 0 2px #fff;
  transform: scale(var(--inv, 1));
}
.pgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.ptile {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: var(--plan-bg);
}
.ptile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pdel {
  position: absolute;
  top: 0;
  right: 0;
  width: 44px; /* the same 34 px dark dot as before, in a 44 px tap area at the corner */
  height: 44px;
  border: 0;
  padding: 0;
  background: radial-gradient(circle 17px at 50% 50%, rgba(0, 0, 0, 0.6) 16.5px, transparent 17px);
  color: #fff;
  font-weight: 700;
  font-size: var(--fs-s);
}
.pempty {
  grid-column: 1/-1;
  border-radius: var(--r);
  background: var(--plan-bg);
  color: var(--muted);
  font-size: var(--fs-m);
  padding: 22px;
  text-align: center;
}
.cats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.cat {
  border: 1.5px solid var(--cc);
  background: transparent;
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 12px;
  min-height: 44px;
  font-weight: 600;
  font-size: var(--fs-m);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cat::before {
  content: "";
  flex: 0 0 auto;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cc);
}
.cat.on {
  background: var(--cc);
  color: var(--ci, #fff);
}
.cat.on::before {
  background: var(--ci, #fff);
}
.cchip {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--cc);
  border: 1px solid var(--cc);
  border-radius: 9px;
  padding: 1px 7px;
  line-height: var(--lh);
  min-width: 0;
  max-width: 100%;
}
.cchip.w1 {
  /* one word: shortened with … ; several words wrap (see oneWord) */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.listhead {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 12px;
}
.linkbtn {
  background: none;
  border: 0;
  padding: 4px 0;
  min-height: 44px;
  color: var(--tag);
  font-weight: 600;
  font-size: var(--fs-m);
  cursor: pointer;
}
.exgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.exgrid .btn {
  padding: 14px 8px;
  flex-direction: column;
  gap: 2px;
}
.exgrid .btn small {
  font-weight: 500;
  font-size: var(--fs-xs);
  opacity: 0.85;
}
.cat.add {
  border-style: dashed;
  border-color: var(--line);
  color: var(--tag);
}
.cat.add::before {
  display: none;
}
.catform {
  flex: 1 1 100%;
  display: grid;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 10px;
  background: var(--paper);
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
}
.sw {
  width: 44px; /* a 30 px dot in a 44 px tap area */
  height: 44px;
  border-radius: 50%;
  border: 7px solid transparent;
  background: var(--cc) padding-box;
}
.sw.on {
  box-shadow: inset 0 0 0 2px var(--ink);
}
.swcustom {
  width: 44px;
  height: 44px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: none;
  cursor: pointer;
}
.catrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.catrow .cat {
  margin-right: auto;
}
.catrow .sbtn {
  flex: 0 0 auto;
  padding: 8px 14px;
}
.sbtn.ok {
  background: var(--tag);
  color: var(--tag-ink);
  border-color: var(--tag);
}
.catlist {
  display: grid;
  gap: 8px;
}
.catitem {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.catitem small {
  color: var(--muted);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
  margin-right: auto;
}
.catitem .sbtn {
  flex: 0 0 auto;
  padding: 7px 12px;
}
/* One line: category, number of points, Ändra, Radera. A long single-word name is shortened with "…" */
.catlist,
.catitem.one {
  min-width: 0; /* let the row shrink to the sheet instead of widening it */
}
.catitem.one {
  flex-wrap: nowrap;
}
.catitem.one .cat {
  min-width: 0;
  flex: 0 1 auto;
}
.catitem.one .cn {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.catitem.one small {
  flex: 0 0 auto;
  white-space: nowrap;
}
.muted {
  color: var(--muted);
  font-size: var(--fs-s);
}
.movebar .sbtn.danger {
  color: var(--danger);
}
.mk i {
  white-space: nowrap;
}
.mk.long i {
  min-width: 34px;
  height: 34px;
  padding: 0;
  font-size: var(--fs-xs);
  letter-spacing: -0.02em;
}
.prio {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pbtn {
  width: 46px;
  height: 44px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: var(--fs-l);
}
.pbtn.on {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.prio .muted {
  margin-left: 4px;
}
input[type="date"] {
  width: 100%;
  font: inherit;
  font-size: var(--fs-b);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 11px 12px;
  min-height: 46px;
}
@media (max-width: 380px) {
  .hint {
    font-size: var(--fs-s);
    padding: 6px 12px;
  }
  .bar h1 {
    font-size: var(--fs-b);
  }
  .bar .btn.primary {
    padding: 9px 11px !important;
    font-size: var(--fs-m) !important;
  }
}
.fname {
  margin: 0;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-s);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.sugg {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}
.sugg:empty {
  display: none;
}
.schip {
  text-align: left;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: var(--fs-m);
  line-height: var(--lh);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.schip::before {
  content: "↳ ";
  color: var(--tag);
  font-weight: 700;
}
.schip small {
  color: var(--muted);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
}
/* pictures still loading: a grey shape of the right size that shimmers (see loadingShape) */
img.tload,
.stage img.dload {
  background: var(--plan-bg);
}
@media (prefers-reduced-motion: no-preference) {
  img.tload,
  .stage img.dload {
    background: linear-gradient(100deg, var(--plan-bg) 30%, var(--surface) 50%, var(--plan-bg) 70%) var(--plan-bg);
    background-size: 300% 100%;
    animation: shimmer 1.3s linear infinite;
  }
  @keyframes shimmer {
    from {
      background-position: 100% 0;
    }
    to {
      background-position: 0 0;
    }
  }
  .toast {
    animation: toastin 0.22s ease-out;
  }
  @keyframes toastin {
    from {
      opacity: 0;
      translate: 0 10px;
    }
  }
}
.side .sitem {
  grid-template-columns: minmax(0, 1fr);
}
.sitem .stop {
  min-width: 0;
}
.sitem .stop .cchip {
  flex: 0 1 auto;
}
.sitem .stop img {
  flex: none;
}
.field label.check {
  font-size: var(--fs-b);
  font-weight: 600;
  color: var(--ink);
  text-transform: none;
  letter-spacing: 0;
}
/* a file button (a label for the hidden file input, e.g. Ta emot fil under Samarbeta) inside a field is a button, not a field label */
.field label.btn {
  font-size: var(--fs-b);
  color: var(--ink);
  text-transform: none;
  letter-spacing: 0;
}
.check input {
  flex: none;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--surface);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: var(--fs-m);
  z-index: 40;
  max-width: calc(100% - 32px);
  text-align: center;
  pointer-events: none;
}
.busy {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(10, 14, 12, 0.35);
  display: grid;
  place-items: center;
}
.busy div {
  background: var(--surface);
  color: var(--ink);
  padding: 14px 20px;
  border-radius: 12px;
  font-weight: 600;
}
.busy.prog .pbox {
  width: min(320px, calc(100vw - 48px));
  display: grid;
  gap: 8px;
  padding: 16px 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}
.pbox b {
  font-size: var(--fs-b);
}
.busy.prog .ptrack {
  height: 8px;
  border-radius: 4px;
  background: var(--plan-bg);
  overflow: hidden;
  padding: 0;
}
.ptrack i {
  display: block;
  height: 100%;
  background: var(--tag);
  transform-origin: 0 50%;
  transform: scaleX(0);
  transition: transform 0.25s ease-out;
}
.busy.prog .prow {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 0;
  background: none;
}
.pstep {
  color: var(--muted);
  font-weight: 500;
  font-size: var(--fs-s);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ppct {
  font-family: var(--font-num);
  font-size: var(--fs-s);
  font-variant-numeric: tabular-nums;
}
.pleft {
  color: var(--muted);
  font-weight: 500;
  font-size: var(--fs-xs);
  min-height: 1em;
}
@media (prefers-reduced-motion: reduce) {
  .ptrack i {
    transition: none;
  }
}
/* Object types with requirement checklists (BFS 2024:7) */
.tchip {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  border: 1px solid var(--muted);
  color: var(--muted);
  border-radius: 999px;
  padding: 1px 7px;
  white-space: nowrap;
}
.tchip.bad {
  color: var(--danger);
  border-color: var(--danger);
}
.tchip.good {
  color: var(--ok);
  border-color: var(--ok);
}
.types .cat {
  --cc: var(--ink);
}
.types .cat.on {
  color: var(--surface);
}
.types .cat.on::before {
  background: var(--surface);
}
.checks {
  display: grid;
  gap: 12px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.chead {
  display: grid;
  gap: 3px;
}
.chead b {
  font-size: var(--fs-l);
}
.chead span {
  font-size: var(--fs-s);
  color: var(--muted);
}
.chead span.bad {
  color: var(--danger);
  font-weight: 600;
}
.cgroup {
  display: grid;
  gap: 8px;
}
.creq {
  border: 1px solid var(--line);
  border-left: 5px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  display: grid;
  gap: 7px;
  background: var(--surface);
}
.creq.ok {
  border-left-color: var(--ok);
}
.creq.fail {
  border-left-color: var(--danger);
}
.creq.na {
  border-left-color: var(--muted);
}
.creq.na p {
  color: var(--muted);
}
.creq p {
  margin: 0;
  line-height: var(--lh);
  font-size: var(--fs-b);
}
.creq small {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.creq details {
  font-size: var(--fs-s);
  color: var(--muted);
  line-height: var(--lh);
}
.creq summary {
  cursor: pointer;
  color: var(--tag);
  font-weight: 600;
  font-size: var(--fs-s);
}
.creq details p {
  font-size: var(--fs-s);
  color: var(--muted);
  margin-top: 4px;
}
.cbtns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.cbtn {
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 6px 4px;
  font-size: var(--fs-s);
  font-weight: 600;
  line-height: var(--lh-tight);
  min-height: 44px;
}
.cbtn.ok.on {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--surface);
}
.cbtn.fail.on {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--surface);
}
.cbtn.na.on {
  background: var(--muted);
  border-color: var(--muted);
  color: var(--surface);
}
.savebar {
  position: sticky;
  bottom: 0;
  z-index: 3;
  background: var(--surface);
  padding-block: 10px;
  box-shadow: 0 -10px 10px -10px rgba(0, 0, 0, 0.25);
}
/* Floors without a drawing: the objects as a list */
.choice {
  display: grid;
  gap: 4px;
  text-align: left;
  border: 1.5px solid var(--line);
  border-radius: var(--r);
  padding: 14px 16px;
  background: var(--surface);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.choice b {
  font-size: var(--fs-b);
}
.choice span {
  color: var(--muted);
  font-size: var(--fs-m);
  line-height: var(--lh);
}
.olist {
  display: grid;
  align-content: start;
  gap: 0;
  background: var(--paper);
}
.addobj {
  width: 100%;
  margin-bottom: 10px;
}
.ocard {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 72px;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  width: 100%;
}
.ocard .n {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: var(--fs-l);
  min-width: 30px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.ocard img,
.ocard .ph {
  width: 72px;
  height: 54px;
  object-fit: cover;
  border-radius: 6px;
  background: var(--plan-bg);
  display: block;
}
.ocard p {
  margin: 0;
  line-height: var(--lh);
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ocard p.none {
  color: var(--muted);
  font-style: italic;
}
.otop {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 3px;
}
.otop:empty {
  display: none;
}
.oprio {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--muted);
}
/* PIN lock */
.lock {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 24px max(16px, env(safe-area-inset-left, 0px));
}
.lockbox {
  width: 100%;
  max-width: 340px;
  display: grid;
  gap: 12px;
  text-align: center;
}
.lockbox img {
  width: 76px;
  height: 76px;
  margin: 0 auto 4px;
  border-radius: 18px;
}
.lockbox h1 {
  font-size: var(--fs-xl);
  margin: 0;
}
.lockbox p {
  margin: 0;
  color: var(--muted);
  line-height: var(--lh);
}
input.pinin {
  -webkit-text-security: disc;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xxl);
  letter-spacing: 0.35em;
  text-align: center;
}
input.pinin.pwin {
  font-family: inherit;
  font-size: var(--fs-l);
  letter-spacing: 0.08em;
}
.meter {
  display: grid;
  gap: 6px;
  margin-top: -6px;
}
.meter .mbar {
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
}
.meter .mbar i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--danger);
  transition:
    width 0.2s,
    background 0.2s;
}
.meter[data-level="1"] .mbar i {
  background: #c98a00;
}
.meter[data-level="2"] .mbar i,
.meter[data-level="3"] .mbar i {
  background: var(--ok);
}
.meter small {
  line-height: var(--lh);
}
.err,
.lockbox .err {
  color: var(--danger);
  font-size: var(--fs-m);
  margin: 0;
  line-height: var(--lh);
}
.err:empty {
  display: none;
}
.shield .app,
.shield .scrim,
.shield .toast,
.shield .busy {
  visibility: hidden;
}
.shield::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 70;
  background: var(--paper) url(icon-192.png) center/88px no-repeat;
}
/* Undo, quick texts, groups */
.toast.undo {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 6px 6px 6px 16px;
}
.toast.undo button {
  pointer-events: auto;
  border: 0;
  border-radius: 999px;
  background: var(--tag);
  color: var(--tag-ink);
  font-weight: 700;
  padding: 8px 14px;
  font-size: var(--fs-m);
}
.suggwrap {
  display: grid;
  gap: 6px;
}
.schip.fav::before {
  content: "★ ";
}
.favadd {
  justify-self: start;
  font-size: var(--fs-s);
}
.frow.phr {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: default;
}
.frow.phr span {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: var(--lh);
}
.pdelx {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  color: var(--danger);
  font-weight: 700;
}
.exinfo {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.exinfo li {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 10px;
  align-items: baseline;
  font-size: var(--fs-m);
  line-height: var(--lh);
  color: var(--muted);
}
.exinfo b {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--tag-deep);
  background: var(--tag-soft);
  border-radius: 6px;
  padding: 2px 0;
  text-align: center;
}
.version {
  font-size: var(--fs-xs);
  text-align: center;
  margin: 4px 0 0;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}
/* Marking photos */
.pview {
  display: block;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
.pview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pfirst {
  position: absolute;
  left: 4px;
  bottom: 4px;
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  font-size: var(--fs-xs);
  font-weight: 700;
  border-radius: 999px;
  padding: 2px 7px;
  pointer-events: none;
}
.pmark {
  position: absolute;
  left: 4px;
  top: 4px;
  background: var(--tag);
  color: var(--tag-ink);
  font-size: var(--fs-xs);
  font-weight: 700;
  border-radius: 999px;
  padding: 2px 7px;
  pointer-events: none;
}
.phed {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: #101312;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px))
    max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
.phbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}
.phbar:empty {
  display: none;
}
.phtool {
  border: 1px solid #3a413e;
  background: #1d2120;
  color: #e8ece9;
  border-radius: 999px;
  padding: 9px 14px;
  font-weight: 600;
  font-size: var(--fs-m);
  min-height: 40px;
}
.phtool.on {
  background: #e53935;
  border-color: #e53935;
  color: #fff;
}
.phtool[disabled] {
  opacity: 0.4;
}
.phstage {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.phcanvas {
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
  background: #000;
}
.phfoot {
  display: flex;
  gap: 10px;
}
.phfoot .btn {
  flex: 1;
}
.phfoot .btn.ghost {
  color: #e8ece9;
  border-color: #3a413e;
}
.livelen {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 10;
  pointer-events: none;
  white-space: nowrap;
  font: 600 13px var(--font-num);
  color: #0d47a1;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 6px;
  padding: 1px 6px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}
.livelen.m {
  color: #b71c1c;
  font-size: var(--fs-m);
}
.loupe {
  position: absolute;
  left: 0;
  top: 0;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  pointer-events: none;
  z-index: 9;
  background: #fff;
}
/* Drawing edits */
.stage svg.edits {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  overflow: visible;
}
.stage.editing .mk {
  pointer-events: none;
}
.stage.editing .mk i {
  opacity: 0.3;
}
/* Drawing tools: a narrow column of symbols at the edge (left, or right by the setting "Ritverktygen"), anchored at
   the bottom where the thumb is, and above it a box of symbols for what the chosen tool (or the chosen drawn thing)
   can do: the box grows upwards, so the tools never move under the finger. The wrapper lets touches through to the
   drawing around them. */
/* one size for all the drawing view's symbols, from the screen's short side: larger on a tablet, smaller on a
   small phone such as an iPhone mini */
.vp {
  --ecell: clamp(44px, 11vmin, 58px);
  --lcell: var(--ecell);
}
.editbar {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
}
.ecol {
  position: absolute;
  top: 10px;
  left: max(8px, env(safe-area-inset-left, 0px));
  bottom: calc(var(--lcell) + 32px); /* clear of the one button at the bottom (the tool that is out) */
  display: flex;
  flex-direction: column-reverse; /* the tools at the bottom, the box of choices above them */
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
}
.etools,
.eopts {
  pointer-events: auto;
  display: grid;
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
}
.eopts:empty {
  display: none;
}
.etool,
.eopt {
  width: var(--ecell, 44px);
  height: var(--ecell, 44px);
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  color: var(--ink);
  transition:
    background-color 0.15s,
    transform 0.15s;
}
.etool:active,
.eopt:active {
  transform: scale(0.94);
}
.etool.on,
.eopt.on {
  background: var(--tag-soft);
  border-color: var(--tag);
}
.eopt:disabled {
  opacity: 0.35;
}
.eopt.danger {
  color: var(--danger);
}
.eopt.end {
  color: var(--danger);
}
.ico {
  width: 30px;
  height: 30px;
  overflow: visible;
}
/* the symbols follow the size of their buttons, which shrink together on a small screen */
.etool .ico {
  width: calc(var(--ecell, 44px) * 0.68);
  height: calc(var(--ecell, 44px) * 0.68);
}
.eopt .ico {
  width: calc(var(--ecell, 44px) * 0.6);
  height: calc(var(--ecell, 44px) * 0.6);
}
/* a value rather than a symbol: the scale, and what was measured */
.eopt.escale {
  width: auto;
  min-width: var(--ecell, 44px);
  padding: 0 4px;
  font-size: calc(var(--ecell, 44px) * 0.28);
  font-weight: 700;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  border-color: var(--line);
}
/* what was measured: its own label beside the top of the box, so the box never changes size */
.editbar .mres {
  position: absolute;
  top: 10px;
  left: calc(max(8px, env(safe-area-inset-left, 0px)) + 64px);
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-l);
  font-weight: 700;
  color: var(--danger);
  white-space: nowrap;
  /* always as wide as "9999,9 km", so the label does not grow or jump while measuring */
  box-sizing: border-box;
  width: calc(9ch + 26px);
  text-align: center;
}
.elen {
  display: grid;
  justify-items: center;
  gap: 0;
}
.elen input {
  width: var(--ecell, 44px);
  height: calc(var(--ecell, 44px) - 14px);
  padding: 1px;
  text-align: center;
  font-size: calc(var(--ecell, 44px) * 0.3);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}
.elen small {
  font-size: 11px;
  line-height: 13px;
  color: var(--muted);
}
@media (max-height: 520px) {
  /* landscape: the box sits beside the column, its symbols in columns of four */
  .ecol {
    top: 6px;
    bottom: 6px;
    flex-direction: row;
    align-items: flex-end;
  }
  .editbar .mres {
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
  }
  /* while drawing, Mät and the pen move to the right edge, beside each other, so the tool column can use the
     whole height */
  .vp.editing .ltools {
    left: auto;
    right: max(12px, env(safe-area-inset-right, 0px));
    grid-auto-flow: column;
  }
  .etools {
    gap: 2px;
    padding: 3px;
  }
}
/* the ends of the chosen drawn thing: drag one to make it longer or shorter */
.edits .ehandle {
  fill: #fff;
  stroke: var(--tag);
  stroke-width: 2.5px;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.35));
}
/* bottom left of the drawing (or right, by the setting): the settings, the object list, and ISO, Mät and the pen
   that open the drawing tools; a little more room between the two groups */
.ltools {
  position: absolute;
  left: max(12px, env(safe-area-inset-left, 0px));
  bottom: 12px;
  display: grid;
  gap: 10px;
}
.ltools .sidebtn + .editbtn:not(.sidebtn) {
  margin-top: 8px;
}
/* while the drawing is moved or zoomed: the margin fades so the drawing under it shows (see bindGestures) */
.ltools,
.ecol {
  transition: opacity 0.18s;
}
.vp.panning .ltools,
.vp.panning .ecol {
  opacity: 0.2;
}
/* a short drawing area: two columns of three (see fitMargin) */
.ltools.two {
  grid-template-rows: repeat(3, auto);
  grid-auto-flow: column;
}
.ltools.two .sidebtn + .editbtn:not(.sidebtn) {
  margin-top: 0;
}
:root[data-hand="right"] .ltools.two {
  direction: rtl;
}
@media (max-height: 520px) {
  /* a phone on its side: the buttons in a row at the bottom (a column would not fit) */
  .ltools {
    grid-auto-flow: column;
  }
  .ltools .sidebtn + .editbtn:not(.sidebtn) {
    margin-top: 0;
    margin-left: 8px;
  }
}
/* on a floor without a drawing the two settings stand in the top bar */
.barbtns {
  display: flex;
  gap: 8px;
  margin-left: auto;
}
.barbtns .ico {
  width: 26px;
  height: 26px;
}
.ltools .editbtn {
  width: calc(var(--lcell, 44px) + 4px);
  height: calc(var(--lcell, 44px) + 4px);
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
}
.ltools .ico {
  width: calc(var(--lcell, 44px) * 0.62);
  height: calc(var(--lcell, 44px) * 0.62);
}
.ltools .editbtn.on {
  background: var(--tag-soft);
  border-color: var(--tag);
  color: var(--ink);
}
.ltools .editbtn:active {
  transform: scale(0.94);
}
@media (max-height: 520px) {
  .etools {
    top: 6px;
    gap: 2px;
    padding: 3px;
  }
  .etool {
    width: 40px;
    height: 40px;
  }
  .eopts {
    top: 6px;
    padding: 6px;
    left: calc(max(6px, env(safe-area-inset-left, 0px)) + 56px);
  }
  .eopts span {
    display: none;
  }
}

.field .row select {

select {

.pcard {

.mback {

}

.kindline {

}
/* "Är du säker?" – centred over everything, two buttons of equal size */
.askscrim {

}
.askbox {

.btn.danger.solid {

  justify-content: flex-end;
}
/* the setting "Ritverktygen: Höger": everything of the tools mirrored to the right edge; with the object list open
   the buttons stand beside the list */
:root[data-hand="right"] .ecol {
  left: auto;
  right: max(8px, env(safe-area-inset-right, 0px));
  align-items: flex-end;
}
:root[data-hand="right"] .ecol.beside {
  flex-direction: row-reverse;
}
:root[data-hand="right"] .ltools {
  left: auto;
  right: max(12px, env(safe-area-inset-right, 0px));
}
:root[data-hand="right"] .vp.with-side .ltools {
  right: calc(min(48%, 250px) + 12px);
}
:root[data-hand="right"] .editbar .mres {
  left: max(8px, env(safe-area-inset-left, 0px));
}
@media (max-height: 520px) {
  :root[data-hand="right"] .ecol {
    flex-direction: row-reverse;
  }
  .editbar.sym .ecol:not(.beside) {
    flex-direction: row;
  }
  :root[data-hand="right"] .editbar.sym .ecol:not(.beside) {
    flex-direction: row-reverse;
  }
  :root[data-hand="right"] .vp.editing .ltools {
    right: auto;
    left: max(12px, env(safe-area-inset-left, 0px));
  }
  :root[data-hand="right"] .editbar .mres {
    left: 50%;
  }
}
/* Inställningar → Logga: the logo on a white "page" strip, placed as it will be in the header */
.logobox {
  display: flex;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 64px;
  align-items: center;
}
.logobox.logo-center {
  justify-content: center;
}
.logobox.logo-right {
  justify-content: flex-end;
}
.logobox img {
  max-height: 44px;
  max-width: 60%;
  object-fit: contain;
}
.logobtns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* ---------- Samarbeta ---------- */
.qrbox {
  display: grid;
  justify-content: center;
  padding: 12px;
  background: #fff;
  border-radius: var(--r);
}
.qrbox canvas {
  width: 212px;
  height: 212px;
  image-rendering: pixelated;
}
.collcode {
  margin: 0;
  text-align: center;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: min(
    var(--fs-l),
    calc((100vw - 64px) / 12.6)
  ); /* the 19 characters always on one line, also with big text */
  font-weight: 700;
  letter-spacing: 0.06em;
  white-space: nowrap;
  user-select: all;
}
.members {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.members li {
  display: grid;
  gap: 2px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.members small {
  color: var(--muted);
}
/* an object changed here and not yet sent to the other phone */
.tchip.sync {
  color: var(--tag);
  border-color: var(--tag);
}

/* Utseende → Färgtema: the button and the page with the colours */
.accentbtn {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
}
.accentbtn .grow {
  flex: 1;
}
.accentbtn i,
.accents .mrow i {
  font-style: normal;
  color: var(--muted);
}
.accents .mrow {
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 12px;
  min-height: 52px;
}
.accents .mrow i {
  grid-column: 3;
  grid-row: 1;
}
.accents .mrow.on i {
  color: var(--tag);
  font-weight: 700;
}
.acsw {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--sw);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .acsw {
    background: var(--sw-d);
  }
}
:root[data-theme="dark"] .acsw {
  background: var(--sw-d);
}
</style>
