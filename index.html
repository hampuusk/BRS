<style>
/* Layout: one-screen app. Project list → full-bleed drawing with pan/zoom, bottom bar, slide-up sheets. Markers are numbered site tags. */
:root{
  --paper:#f6f7f5; --surface:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#d9dedb;
  --tag:#e2551b; --tag-ink:#ffffff; --tag-soft:#fbe6dc; --ok:#2f7d55; --danger:#b3261e;
  --plan-bg:#e9ece9;
  --font-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141716; --surface:#1d2120; --ink:#e8ece9; --muted:#9aa5a0; --line:#323836;
  --tag:#ff6a2b; --tag-ink:#1a0d06; --tag-soft:#3a2219; --ok:#5fc08e; --danger:#ff8a80; --plan-bg:#0e1110; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141716; --surface:#1d2120; --ink:#e8ece9; --muted:#9aa5a0; --line:#323836;
  --tag:#ff6a2b; --tag-ink:#1a0d06; --tag-soft:#3a2219; --ok:#5fc08e; --danger:#ff8a80; --plan-bg:#0e1110; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--tag);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--tag);color:var(--tag-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--tag-soft);border-radius:8px;padding:8px 12px;line-height:1.4}

/* Projects */
.plist{display:grid;gap:10px;margin-top:10px}
.pcard{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;width:100%}
.pcard img,.pcard .ph{width:72px;height:56px;object-fit:cover;border-radius:6px;background:var(--plan-bg);display:block}
.pcard b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard small{color:var(--muted);font-size:13px}
.pcard>div{min-width:0}
.count{font-family:var(--font-num);font-size:13px;background:var(--tag-soft);color:var(--tag);border-radius:999px;padding:3px 9px;font-weight:600}
.empty{margin-top:24px;border:1.5px dashed var(--line);border-radius:var(--r);padding:24px 18px;display:grid;gap:14px}
.empty h2{margin:0;font-size:22px;text-wrap:balance}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;color:var(--muted);line-height:1.4}
.steps li span{width:26px;height:26px;border-radius:50%;background:var(--tag);color:var(--tag-ink);font-family:var(--font-num);font-size:13px;display:grid;place-items:center;font-weight:600}

/* Plan view */
.vp{flex:1;min-height:0;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--plan-bg);touch-action:none;cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.mk{position:absolute;width:0;height:0}
.mk i{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--inv,1));transform-origin:50% 50%;
  font-style:normal;font-family:var(--font-num);font-weight:600;font-size:14px;color:#fff;background:var(--mc,var(--tag));
  min-width:28px;height:28px;padding:0 6px;border-radius:999px;display:grid;place-items:center;
  box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
.mk.pending i{outline:2px dashed var(--ink);outline-offset:2px}

.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;gap:6px}
.zoom button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.foot{display:flex;gap:10px;padding-block:10px;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot .btn{flex:1}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.shead{display:flex;align-items:center;gap:12px}
.bigtag{font-family:var(--font-num);font-weight:600;font-size:20px;background:var(--tag);color:var(--tag-ink);height:40px;min-width:40px;padding:0 10px;border-radius:999px;display:grid;place-items:center}
.shead h2{margin:0;font-size:20px;flex:1}
.photo{border-radius:var(--r);background:var(--plan-bg);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px;text-align:center;padding:0}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:12px;font-weight:600;cursor:pointer;background:var(--surface)}
.pick label{position:relative;overflow:hidden}
.pick input,.hidden-input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
label.btn{cursor:pointer;user-select:none;-webkit-user-select:none}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 120px}

/* List */
.plist2{display:grid;gap:0}
.pt{display:grid;grid-template-columns:auto 64px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.pt .n{font-family:var(--font-num);font-weight:600;color:var(--tag);font-size:16px;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.pt img,.pt .ph{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--plan-bg);display:block}
.pt p{margin:0;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.pt p.none{color:var(--muted);font-style:italic}

 .floors{display:flex;gap:6px;overflow-x:auto;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.floors::-webkit-scrollbar{display:none}
.floor{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.floor span{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.floor.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.floor.on span{color:var(--surface);opacity:.75}
.floor.add{border-style:dashed;color:var(--tag);user-select:none;-webkit-user-select:none}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--tag)}
.pt small.fl{display:block;font-size:12px;color:var(--muted);font-style:normal;text-transform:uppercase;letter-spacing:.05em}
.floor em{font-style:normal;font-weight:700;margin-left:2px;opacity:.8}
.ptrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.ptrow .pt{border-bottom:0}
.trash{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--danger);font-size:15px;font-weight:700}
.ptconfirm{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0}
.ptconfirm span{flex:1 1 100%;font-weight:600}
.ptconfirm .btn{flex:1;padding:10px}
.flist{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.frow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;background:var(--surface);border:0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow span{font-family:var(--font-num);font-size:13px;color:var(--muted);text-align:right}
.frow i{grid-column:1/-1;font-style:normal;font-size:13px;color:var(--tag)}
.side{position:absolute;top:0;right:0;bottom:0;width:min(48%,250px);background:var(--surface);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.14);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;z-index:6;cursor:default;scroll-snap-type:y proximity}
.sidehead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sidehead b{font-size:15px}
.sidehead span{grid-row:2;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sideclose{grid-row:1/3;grid-column:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.side .spacer{height:calc(50% - 70px)}
.sideempty{padding:14px 12px;color:var(--muted);font-size:14px;line-height:1.4;margin:0}
.sitem{scroll-snap-align:center;padding:10px 12px 10px 10px;border-left:4px solid transparent;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:4px}
.sitem .stop{display:flex;align-items:center;gap:8px}
.sitem .stop b{font-family:var(--font-num);font-size:18px;color:var(--tag);min-width:24px;font-variant-numeric:tabular-nums}
.sitem .stop img{width:44px;height:33px;object-fit:cover;border-radius:4px;margin-left:auto}
.sitem p{margin:0;font-size:14px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sitem p.none{color:var(--muted);font-style:italic}
.sactions{display:none;flex-wrap:wrap;gap:5px;margin-top:4px}
.sactions .sbtn{flex:1 1 auto;padding:6px 7px;font-size:12px}
.sitem.sel{background:var(--tag-soft);border-left-color:var(--tag)}
.sitem.sel .sactions{display:flex}
.sitem.sel p{-webkit-line-clamp:unset;display:block}
.sbtn{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 6px;font-weight:600;font-size:13px}
.sbtn.danger{color:var(--danger)}
.sbtn.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.sask{flex:1 1 100%;font-size:13px;font-weight:600}
.sidetoggle{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:6;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.vp.with-side .hint{left:calc((100% - min(48%,250px))/2);max-width:calc(100% - min(48%,250px) - 24px);top:56px}
.vp.with-side .zoom{right:calc(min(48%,250px) + 10px)}
.vp:not(.with-side) .hint{top:56px}
.stage.anim{transition:transform .35s ease}
.stage.dim .mk:not(.sel) i{opacity:.35}
.mk.sel{z-index:3}
.mk.sel i{transform:translate(-50%,-50%) scale(calc(var(--inv,1)*1.35))}
.mk.sel::after{content:"";position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;border:3px solid var(--mc,var(--tag));transform:scale(var(--inv,1));pointer-events:none}
@media (prefers-reduced-motion:no-preference){.mk.sel::after{animation:pulse 1.4s ease-out infinite}@keyframes pulse{from{transform:scale(calc(var(--inv,1)*.6));opacity:1}to{transform:scale(calc(var(--inv,1)*1.5));opacity:0}}}
.movebar{position:absolute;top:10px;left:10px;right:10px;z-index:7;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.movebar span{flex:1 1 160px;font-size:13px;line-height:1.35}
.movebar b{display:block;font-size:15px}
.movebar .sbtn{flex:0 0 auto;padding:8px 14px;color:var(--ink)}
.movebar .sbtn.ok{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.vp.with-side .movebar{right:calc(min(48%,250px) + 10px)}
.stage.moveon .mk:not(.moving) i{opacity:.35}
.mk.moving{z-index:4}
.mk.moving i{background:var(--ink);color:var(--surface);transform:translate(-50%,calc(-100% - 20px*var(--inv,1))) scale(calc(var(--inv,1)*1.45));box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.45)}
.mk.moving::before{content:"";position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--tag);box-shadow:0 0 0 2px #fff;transform:scale(var(--inv,1))}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ptile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--plan-bg)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.pdel{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:13px}
.pempty{grid-column:1/-1;border-radius:var(--r);background:var(--plan-bg);color:var(--muted);font-size:14px;padding:22px;text-align:center}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:1.5px solid var(--cc);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.cat::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc)}
.cat.on{background:var(--cc);color:#fff}
.cat.on::before{background:#fff}
.cchip{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--cc);border:1px solid var(--cc);border-radius:999px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.listhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.listtools{display:flex;gap:14px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--tag);font-weight:600;font-size:14px;cursor:pointer}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exgrid .btn{padding:14px 8px;flex-direction:column;gap:2px}
.exgrid .btn small{font-weight:500;font-size:12px;opacity:.85}
.cat.add{border-style:dashed;border-color:var(--line);color:var(--tag)}
.cat.add::before{display:none}
.catform{flex:1 1 100%;display:grid;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--paper)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--cc);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swcustom{width:30px;height:30px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer}
.catrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.catrow .cat{margin-right:auto}
.catrow .sbtn{flex:0 0 auto;padding:8px 14px}
.sbtn.ok{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.catlist{display:grid;gap:8px}
.catitem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.catitem small{color:var(--muted);font-family:var(--font-num);font-size:12px;margin-right:auto}
.catitem .sbtn{flex:0 0 auto;padding:7px 12px}
.muted{color:var(--muted);font-size:13px}
.stage.moveon .mk.placing i{opacity:1}
.mk.placing i{box-shadow:0 0 0 3px var(--ink),0 2px 6px rgba(0,0,0,.35)}
.plc{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.movebar .sbtn.danger{color:var(--danger)}
.subs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.subchip{border:1.5px solid var(--cc);background:transparent;border-radius:999px;padding:5px 10px;font-family:var(--font-num);font-weight:600;font-size:13px;color:var(--ink)}
.subchip small{font-family:var(--font-ui);color:var(--muted);font-weight:500}
.inherit{display:grid;gap:6px;justify-items:start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.inherit p{margin:0;line-height:1.4}
.mk i{white-space:nowrap}
.mk.long i{min-width:34px;height:34px;padding:0;font-size:11.5px;letter-spacing:-.02em}
.prio{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbtn{width:46px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--font-num);font-weight:600;font-size:18px}
.pbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.prio .muted{margin-left:4px}
.uppill{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;min-height:46px}

.fname{margin:0;font-family:var(--font-num);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.sugg{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.sugg:empty{display:none}
.schip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.schip::before{content:"↳ ";color:var(--tag);font-weight:700}
.schip small{color:var(--muted);font-family:var(--font-num);font-size:12px}
img.tload{background:var(--plan-bg)}
.side .sitem{grid-template-columns:minmax(0,1fr)}
.sitem .stop{min-width:0}
.sitem .stop .cchip{flex:0 1 auto}

.field label.check{font-size:15px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;pointer-events:none}

.busy{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.35);display:grid;place-items:center}
.busy div{background:var(--surface);color:var(--ink);padding:14px 20px;border-radius:12px;font-weight:600}
/* Object types with requirement checklists (BFS 2024:7) */
.tchip{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--muted);color:var(--muted);border-radius:999px;padding:1px 7px;white-space:nowrap}
.tchip.bad{color:var(--danger);border-color:var(--danger)}
.tchip.good{color:var(--ok);border-color:var(--ok)}

.types .cat.on::before{background:var(--surface)}
.checks{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.chead{display:grid;gap:3px}
.chead b{font-size:18px}
.chead span{font-size:13px;color:var(--muted)}

.cgroup{display:grid;gap:8px}
.creq{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:7px;background:var(--surface)}
.creq.ok{border-left-color:var(--ok)}
.creq.fail{border-left-color:var(--danger)}
.creq.na{border-left-color:var(--muted)}
.creq.na p{color:var(--muted)}
.creq p{margin:0;line-height:1.4;font-size:15px}
.creq small{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.creq details{font-size:13px;color:var(--muted);line-height:1.4}
.creq summary{cursor:pointer;color:var(--tag);font-weight:600;font-size:13px}
.creq details p{font-size:13px;color:var(--muted);margin-top:4px}
.cbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 4px;font-size:13px;font-weight:600;line-height:1.2;min-height:44px}
.cbtn.ok.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.cbtn.fail.on{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.cbtn.na.on{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.savebar{position:sticky;bottom:0;z-index:3;background:var(--surface);padding-block:10px;box-shadow:0 -10px 10px -10px rgba(0,0,0,.25)}

.choice{display:grid;gap:4px;text-align:left;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);cursor:pointer;user-select:none;-webkit-user-select:none}
.choice b{font-size:17px}
.choice span{color:var(--muted);font-size:14px;line-height:1.4}
.olist{display:grid;align-content:start;gap:0;background:var(--paper)}
.addobj{width:100%;margin-bottom:10px}
.ocard{display:grid;grid-template-columns:auto minmax(0,1fr) 72px;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.ocard .n{font-family:var(--font-num);font-weight:600;font-size:18px;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.ocard img,.ocard .ph{width:72px;height:54px;object-fit:cover;border-radius:6px;background:var(--plan-bg);display:block}
.ocard p{margin:0;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.otop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px}
.otop:empty{display:none}
.oprio{font-family:var(--font-num);font-size:12px;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
