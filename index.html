<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlanPin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>PlanPin</title>
<script type="module" src="pdf-init.mjs"></script>
<script src="pdf-lib.min.js"></script>
<style>
/* Layout: one-screen app. Project list → full-bleed drawing with pan/zoom, bottom bar, slide-up sheets. Markers are numbered site tags. */
:root{
  --paper:#f6f7f5; --surface:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#d9dedb;
  --tag:#c2410c; --tag-deep:#9a3412; --tag-ink:#ffffff; --tag-soft:#fdebdd; --ok:#2f7d55; --danger:#b3261e;
  --plan-bg:#e9ece9;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141716; --surface:#1d2120; --ink:#e8ece9; --muted:#9aa5a0; --line:#323836;
  --tag:#ff7a33; --tag-deep:#ff7a33; --tag-ink:#1a0d06; --tag-soft:#3b2416; --ok:#5fc08e; --danger:#ff8a80; --plan-bg:#0e1110; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141716; --surface:#1d2120; --ink:#e8ece9; --muted:#9aa5a0; --line:#323836;
  --tag:#ff7a33; --tag-deep:#ff7a33; --tag-ink:#1a0d06; --tag-soft:#3b2416; --ok:#5fc08e; --danger:#ff8a80; --plan-bg:#0e1110; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--tag);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--tag);color:var(--tag-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--tag-soft);border-radius:8px;padding:8px 12px;line-height:1.4}

/* Projects (home page) */
:root{--k-inv:var(--tag);--k-ctl:#2f7d55;--k-notes:#3b6ea5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--k-ctl:#5fc08e;--k-notes:#7fa9dc}}
:root[data-theme="dark"]{--k-ctl:#5fc08e;--k-notes:#7fa9dc}
.home .bar{gap:8px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand h1{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:23px;font-weight:700;letter-spacing:.005em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinmark{flex:none;height:27px;width:20px}
.brand h1 .word{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pinmark .body{fill:var(--tag)} .pinmark .hole{fill:var(--surface)}
.brand h1 .acc{color:var(--tag)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lockbtn{padding:0;width:38px;flex:none}
@media (max-width:420px){.brand h1{font-size:21px;gap:8px}.newbtn{padding:9px 12px}.home .bar{gap:6px}}
.newbtn{gap:0;white-space:pre}
@media (max-width:300px){.newbtn .long{display:none}}
@media (max-width:345px){.home .bar:has(.lockbtn) .newbtn .long{display:none}}
.lockbtn .sicon{background:transparent}
.newbtn{padding:9px 14px;font-size:15px;flex:none}
.storinfo{display:grid;gap:4px;font-size:13px;line-height:1.4}
.storinfo p{margin:0;color:var(--muted)}
.storinfo p.ok{color:var(--ok)}
.storinfo p.warn{color:var(--ink)}
.storinfo .linkbtn{justify-self:start;font-size:13px}
.lostcard{display:grid;gap:8px;border:1.5px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--surface));border-radius:var(--r);padding:14px;margin-bottom:16px}
.lostcard b{font-size:16px;color:var(--danger)}
.lostcard p{margin:0;line-height:1.4;font-size:14px}
.lostcard .row{display:flex;gap:10px;flex-wrap:wrap}
.lostcard .btn{flex:1 1 150px;padding:10px 14px;font-size:15px}
.status{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin-bottom:18px}
.status b{display:block;font-size:15px}
.status small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:1px}
.status .linkbtn{white-space:nowrap}
.sicon{width:28px;height:28px;border-radius:8px;background:var(--tag-soft);position:relative}
.sicon::before{content:"";position:absolute;left:8px;top:12px;width:12px;height:9px;border-radius:2px;background:var(--tag-deep)}
.sicon::after{content:"";position:absolute;left:10px;top:6px;width:8px;height:9px;border:2px solid var(--tag-deep);border-bottom:0;border-radius:5px 5px 0 0;box-sizing:border-box}
.status:not(.on) .sicon::after{left:12px;width:8px}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sortseg{display:inline-flex;background:var(--plan-bg);border-radius:9px;padding:3px;gap:2px}
.seg{border:0;background:transparent;border-radius:7px;padding:6px 11px;font-size:14px;font-weight:600;color:var(--muted);min-width:44px;min-height:32px}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.plist{display:grid;gap:10px;margin-top:12px}
.ghead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:8px 2px -2px}
.ghead:first-child{margin-top:0}
.ghead em{font-style:normal;font-family:var(--font-num);font-size:12px;color:var(--muted);font-weight:600}
.kdot{width:10px;height:10px;border-radius:50%;background:var(--k-inv)}
.pcard{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px;text-align:left;width:100%;transition:border-color .15s,transform .1s}
.pcard:active{transform:scale(.99)}
@media (hover:hover){.pcard:hover{border-color:var(--muted)}}
.pthumb{width:76px;height:64px;border-radius:7px;overflow:hidden;background:var(--plan-bg);border:1px solid var(--line)}
.pthumb img,.pthumb .ph{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .ph{background:repeating-linear-gradient(to bottom,transparent 0 11px,var(--line) 11px 12px);background-position:0 6px;position:relative}
.pthumb .ph::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1.5px;background:color-mix(in srgb,var(--k-notes) 45%,transparent)}
.pbody{min-width:0;display:grid;gap:3px;justify-items:start}
.pbody b{font-size:17px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;max-width:100%}
.pbody small{color:var(--muted);font-size:13px;line-height:1.3}
.pbody small span{white-space:nowrap}
.kchip{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px 1px 7px;display:inline-flex;align-items:center;gap:5px;color:var(--k-inv);background:color-mix(in srgb,var(--k-inv) 13%,transparent)}
.kchip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.k-ctl.kchip,.k-ctl.kdot{--k-inv:var(--k-ctl)} .k-notes.kchip,.k-notes.kdot{--k-inv:var(--k-notes)}
.count{font-family:var(--font-num);font-size:13px;background:var(--tag-soft);color:var(--tag-deep);border-radius:999px;padding:3px 9px;font-weight:600}
.pcount{display:grid;justify-items:center;line-height:1;background:var(--tag-soft);color:var(--tag-deep);border-radius:9px;padding:6px 8px;min-width:44px}
.pcount strong{font-family:var(--font-num);font-size:17px;font-weight:600}
.pcount i{font-style:normal;font-size:11px;font-weight:600;margin-top:2px;opacity:.85}
.backups{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.backups .btnrow{display:flex;gap:10px;flex-wrap:wrap}
.backups .btn{flex:1 1 160px;padding:10px 14px;font-size:15px}
@media (min-width:760px){.home .scroll>*{max-width:760px;margin-left:auto;margin-right:auto}.plist{grid-template-columns:1fr 1fr}.ghead{grid-column:1/-1}}
.empty{margin-top:24px;border:1.5px dashed var(--line);border-radius:var(--r);padding:24px 18px;display:grid;gap:14px}
.empty h2{margin:0;font-size:22px;text-wrap:balance}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;color:var(--muted);line-height:1.4}
.steps li span{width:26px;height:26px;border-radius:50%;background:var(--tag);color:var(--tag-ink);font-family:var(--font-num);font-size:13px;display:grid;place-items:center;font-weight:600}

/* Plan view */
.vp{flex:1;min-height:0;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--plan-bg);touch-action:none;cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.mk{position:absolute;width:0;height:0}
.mk i{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--inv,1));transform-origin:50% 50%;
  font-style:normal;font-family:var(--font-num);font-weight:600;font-size:14px;color:#fff;background:var(--mc,var(--tag));
  min-width:28px;height:28px;padding:0 6px;border-radius:999px;display:grid;place-items:center;
  box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
.mk.pending i{outline:2px dashed var(--ink);outline-offset:2px}

.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;gap:6px}
.zoom button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.foot{display:flex;gap:10px;padding-block:10px;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot .btn{flex:1}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin:-4px 0 -2px;position:relative}
.sheet .grab::before{content:"";position:absolute;inset:-14px -40px}
.sheet{overscroll-behavior:contain;will-change:transform}
.shead{display:flex;align-items:center;gap:12px}
.bigtag{font-family:var(--font-num);font-weight:600;font-size:20px;background:var(--tag);color:var(--tag-ink);height:40px;min-width:40px;padding:0 10px;border-radius:999px;display:grid;place-items:center}
.bigtag[style*=background]{color:#fff}
.shead h2{margin:0;font-size:20px;flex:1}
.photo{border-radius:var(--r);background:var(--plan-bg);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px;text-align:center;padding:0}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:12px;font-weight:600;cursor:pointer;background:var(--surface)}
.pick label{position:relative;overflow:hidden}
.pick input,.hidden-input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
label.btn{cursor:pointer;user-select:none;-webkit-user-select:none}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 120px}

/* List */
.plist2{display:grid;gap:0}
.pt{display:grid;grid-template-columns:auto 64px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.pt .n{font-family:var(--font-num);font-weight:600;color:var(--tag);font-size:16px;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.pt img,.pt .ph{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--plan-bg);display:block}
.pt p{margin:0;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.pt p.none{color:var(--muted);font-style:italic}

 .floors{display:flex;gap:6px;overflow-x:auto;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.floors::-webkit-scrollbar{display:none}
.floor{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.floor span{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.floor.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.floor.on span{color:var(--surface);opacity:.75}
.floor.add{border-style:dashed;color:var(--tag);user-select:none;-webkit-user-select:none}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--tag)}
.pt small.fl{display:block;font-size:12px;color:var(--muted);font-style:normal;text-transform:uppercase;letter-spacing:.05em}
.floor em{font-style:normal;font-weight:700;margin-left:2px;opacity:.8}
.ptrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.ptrow .pt{border-bottom:0}
.trash{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--danger);font-size:15px;font-weight:700}
.ptconfirm{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0}
.ptconfirm span{flex:1 1 100%;font-weight:600}
.ptconfirm .btn{flex:1;padding:10px}
.flist{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.frow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;background:var(--surface);border:0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow span{font-family:var(--font-num);font-size:13px;color:var(--muted);text-align:right}
.frow i{grid-column:1/-1;font-style:normal;font-size:13px;color:var(--tag)}
.side{position:absolute;top:0;right:0;bottom:0;width:min(48%,250px);background:var(--surface);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.14);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;z-index:6;cursor:default;scroll-snap-type:y proximity}
.side{will-change:transform}
.sidehead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sidehead b{font-size:15px}
.sidehead span{grid-row:2;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sideclose{grid-row:1/3;grid-column:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.side .spacer{height:calc(50% - 70px)}
.sideempty{padding:14px 12px;color:var(--muted);font-size:14px;line-height:1.4;margin:0}
.sitem{scroll-snap-align:center;padding:10px 12px 10px 10px;border-left:4px solid transparent;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:4px}
.sitem .stop{display:flex;align-items:center;gap:8px}
.sitem .stop b{font-family:var(--font-num);font-size:18px;color:var(--tag);min-width:24px;font-variant-numeric:tabular-nums}
.sitem .stop img{width:44px;height:33px;object-fit:cover;border-radius:4px;margin-left:auto}
.sitem p{margin:0;font-size:14px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sitem p.none{color:var(--muted);font-style:italic}
.sactions{display:none;flex-wrap:wrap;gap:5px;margin-top:4px}
.sactions .sbtn{flex:1 1 auto;padding:6px 7px;font-size:12px}
.sitem.sel{background:var(--tag-soft);border-left-color:var(--tag)}
.sitem.sel .sactions{display:flex}
.sitem.sel p{-webkit-line-clamp:unset;display:block}
.sbtn{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 6px;font-weight:600;font-size:13px}
.sbtn.danger{color:var(--danger)}
.sbtn.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.sask{flex:1 1 100%;font-size:13px;font-weight:600}
.sidetoggle{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:6;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.vp.with-side .hint{left:calc((100% - min(48%,250px))/2);max-width:calc(100% - min(48%,250px) - 24px);top:56px}
.vp.with-side .zoom{right:calc(min(48%,250px) + 10px)}
.vp:not(.with-side) .hint{top:56px}
.stage.anim{transition:transform .35s ease}
.stage.dim .mk:not(.sel) i{opacity:.35}
