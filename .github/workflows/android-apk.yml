# Builds PlanPin as an Android app (APK) every time something is uploaded to the main branch.
# The APK is found under Actions → the latest run → Artifacts (only visible when you are logged in to GitHub).
name: Android-app (APK)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera signeringsnyckeln
        env:
          KS: ${{ secrets.PLANPIN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Signeringsnyckeln saknas. Lägg in de fyra hemligheterna enligt README (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Förbered webbappen
        run: bash android-app/prepare-www.sh
      - name: Skapa Android-projektet
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node patch-android.mjs
          npx cap sync android
      - name: Bygg APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Signera APK
        env:
          KS: ${{ secrets.PLANPIN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PLANPIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLANPIN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PLANPIN_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KS" | base64 -d > "$RUNNER_TEMP/planpin.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          VER=$(grep -o 'APP_VERSION *= *"[^"]*"' android-app/www/app.js | head -1 | sed 's/.*"V\{0,1\}\([^"]*\)"/\1/')
          OUT="PlanPin-$VER.apk"
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/planpin.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          rm -f "$RUNNER_TEMP/planpin.jks"
          if "$BT/aapt" dump permissions "$OUT" | grep -q INTERNET; then echo "::error::APK:n har internetbehörighet"; exit 1; fi
          echo "APK=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: PlanPin-android-app
          path: ${{ env.APK }}
          retention-days: 90
