# Builds PlanPin as an Android app every time something is uploaded to the main branch, and puts it out as a
# release on GitHub: PlanPin.apk is then always the newest version at
#   https://github.com/<owner>/<repo>/releases/latest/download/PlanPin.apk
# which is where the button "Ladda ner Android-appen" in the web app's Inställningar points.
# (The Google Play build, .aab, is not made here; it is set up separately when the app goes to Google Play.)
name: Android-app (APK)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write   # needed to publish the release with the APK; nothing else is changed in the repository
jobs:
  apk:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from October 2026
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Kontrollera signeringsnyckeln
        env:
          KS: ${{ secrets.PLANPIN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Signeringsnyckeln saknas. Lägg in de fyra hemligheterna enligt README (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21   # Capacitor 8 needs Java 21
      - name: Förbered webbappen
        run: bash android-app/prepare-www.sh
      - name: Skapa Android-projektet
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node patch-android.mjs
          npx cap sync android
      - name: Bygg APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Signera APK
        env:
          KS: ${{ secrets.PLANPIN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PLANPIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLANPIN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PLANPIN_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KS" | base64 -d > "$RUNNER_TEMP/planpin.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          VER=$(grep -o 'APP_VERSION *= *"[^"]*"' android-app/www/app.js | head -1 | sed 's/.*"V\{0,1\}\([^"]*\)"/\1/')
          OUT="PlanPin-$VER.apk"
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/planpin.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          rm -f "$RUNNER_TEMP/planpin.jks"
          PERMS=$("$BT/aapt" dump permissions "$OUT"); echo "$PERMS"
          if echo "$PERMS" | grep -q INTERNET; then echo "::error::Appen har internetbehörighet"; exit 1; fi
          echo "$PERMS" | grep -q "android.permission.CAMERA" || { echo "::error::Kamerabehörigheten saknas"; exit 1; }
          TSDK=$("$BT/aapt" dump badging "$OUT" | grep -o "targetSdkVersion:'[0-9]*'" | grep -o "[0-9]*")
          echo "targetSdk $TSDK"; [ "${TSDK:-0}" -ge 36 ] || { echo "::error::targetSdk $TSDK – nyare Android kräver 36"; exit 1; }
          echo "APK=$OUT" >> "$GITHUB_ENV"; echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Lägg ut APK:n som release (för nedladdningsknappen i webbappen)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          [ -n "$VER" ] && [ -f "$APK" ] || { echo "::error::Ingen APK att lägga ut"; exit 1; }
          TAG="v$VER"
          cp "$APK" PlanPin.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PlanPin.apk "$APK" --clobber   # same version built again: replace the files
          else
            gh release create "$TAG" PlanPin.apk "$APK" --target "$GITHUB_SHA" --latest \
              --title "PlanPin $VER" \
              --notes "Android-appen PlanPin $VER. Ladda ner PlanPin.apk på telefonen och installera. En ny version installeras ovanpå den gamla och uppdragen finns kvar."
          fi
          echo "Nedladdning: https://github.com/$GH_REPO/releases/latest/download/PlanPin.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: PlanPin-android-app
          path: ${{ env.APK }}
          retention-days: 90
          if-no-files-found: error   # no APK = the run fails instead of showing green
